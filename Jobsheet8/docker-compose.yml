# Jalankan seluruh aplikasi + PostgreSQL dengan satu perintah:
#   docker compose up --build
# Lalu buka http://localhost:8080
services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: game_database
      DB_USER: postgres
      DB_PASS: postgres
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: game_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_database"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
